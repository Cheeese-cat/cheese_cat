<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 评鉴 AI 评价助手</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <script>
        (function() {
            if (localStorage.getItem('xiaoyanThemeDark') === 'true') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.27/dist/vue.global.prod.js"></script>
    <style>
        :root {
            --bg: #f6f5ff;
            --surface: #ffffff;
            --surface-soft: #faf9ff;
            --surface-hover: #f2f0ff;
            --line: #e6e3f7;
            --line-strong: #c9c3e8;
            --text: #1e1b2e;
            --text-secondary: #3d3656;
            --muted: #6d6588;
            --muted-light: #a098c0;
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --primary-light: #a78bfa;
            --primary-soft: #ede9fe;
            --primary-glow: rgba(124, 58, 237, .22);
            --accent: #06b6d4;
            --candy: #f472b6;
            --candy-soft: #fce7f3;
            --green: #10b981;
            --green-soft: #d1fae5;
            --amber: #f59e0b;
            --amber-soft: #fef3c7;
            --red: #ef4444;
            --red-soft: #fee2e2;
            --shadow-sm: 0 2px 8px rgba(30, 27, 46, .06);
            --shadow: 0 6px 20px rgba(30, 27, 46, .09);
            --shadow-lg: 0 20px 60px rgba(124, 58, 237, .18);
            --radius: 16px;
            --radius-sm: 12px;
        }

        [data-theme="dark"] {
            --bg: #0f0d17;
            --surface: #1a1726;
            --surface-soft: #221e30;
            --surface-hover: #2a2538;
            --line: #2e2940;
            --line-strong: #3f3956;
            --text: #f0eef8;
            --text-secondary: #c8c3dd;
            --muted: #8b84a8;
            --muted-light: #5c5578;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, .4);
            --shadow: 0 6px 20px rgba(0, 0, 0, .5);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, .6);
            --primary-dark: #c4b5fd;
            --primary-light: #8b5cf6;
            --primary-soft: #2a1f4a;
            --accent-dark: #67e8f9;
            --accent-soft: #0d3a4a;
            --candy-dark: #f9a8d4;
            --candy-soft: #3a1d2e;
            --green: #34d399;
            --green-soft: #0d3a2a;
            --amber: #fbbf24;
            --amber-soft: #3a2d0d;
            --red: #fca5a5;
            --red-soft: #4a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(124, 58, 237, .10) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, .10) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(244, 114, 182, .05) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border-radius: 24px;
            padding: 44px 38px 36px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--candy));
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-mark {
            width: 60px;
            height: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--candy) 100%);
            color: #fff;
            margin-bottom: 16px;
            box-shadow: 0 10px 24px var(--primary-glow);
            position: relative;
            overflow: hidden;
        }

        .brand-mark::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle, rgba(255,255,255,.4) 0%, transparent 55%);
            animation: shimmer 4s infinite linear;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%); }
            100% { transform: translateX(100%) translateY(100%); }
        }

        .brand-mark svg {
            width: 30px;
            height: 30px;
            position: relative;
            z-index: 1;
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--primary-dark), var(--candy));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -.5px;
        }

        .brand p {
            color: var(--muted);
            font-size: 13px;
            letter-spacing: .3px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--line);
            border-radius: var(--radius-sm);
            font-size: 15px;
            transition: all .2s ease;
            outline: none;
            background: var(--surface-soft);
            color: var(--text);
            font-family: inherit;
        }

        .form-group input::placeholder { color: var(--muted-light); }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-soft);
            background: var(--surface);
        }

        .form-group input.error {
            border-color: var(--red);
            background: var(--red-soft);
        }

        .form-group .error-message {
            color: var(--red);
            font-size: 12px;
            margin-top: 6px;
            display: none;
            font-weight: 500;
        }

        .form-group .error-message.show { display: block; }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }

        .form-options label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .form-options a {
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color .15s ease;
        }

        .form-options a:hover { color: var(--primary-dark); }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s ease;
            box-shadow: 0 6px 18px var(--primary-glow);
            letter-spacing: 1px;
            font-family: inherit;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 26px var(--primary-glow);
            filter: brightness(1.05);
        }

        .login-btn:active:not(:disabled) { transform: translateY(0); }

        .login-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn.loading {
            position: relative;
            color: transparent;
        }

        .login-btn.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--muted);
        }

        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color .15s ease;
        }

        .register-link a:hover { color: var(--primary-dark); }

        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 14px 22px;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            transform: translateX(120%);
            transition: transform .3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show { transform: translateX(0); }
        .toast.success { background: linear-gradient(135deg, var(--green), #059669); }
        .toast.error { background: linear-gradient(135deg, var(--red), #dc2626); }
        .toast.info { background: linear-gradient(135deg, var(--primary), var(--accent)); }

        .toast svg { width: 18px; height: 18px; flex: 0 0 18px; }

        .footer-note {
            text-align: center;
            margin-top: 26px;
            font-size: 11px;
            color: var(--muted-light);
            letter-spacing: .5px;
        }

        @media (max-width: 480px) {
            .login-container { padding: 32px 22px 26px; }
            .brand h1 { font-size: 20px; }
            .brand p { font-size: 12px; }
            .form-options {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }

        html.theme-transitioning,
        html.theme-transitioning *,
        html.theme-transitioning *::before,
        html.theme-transitioning *::after {
            transition: background-color 3.5s ease,
            color 3.5s ease,
            border-color 3.5s ease,
            box-shadow 3.5s ease,
            fill 3.5s ease,
            stroke 3.5s ease !important;
            transition-delay: 0s !important;
        }
        html.theme-no-transition,
        html.theme-no-transition *,
        html.theme-no-transition *::before,
        html.theme-no-transition *::after {
            transition: none !important;
        }
    </style>
</head>
<body>
<div id="app">
    <div :class="['toast', toastType, toastVisible ? 'show' : '']">
        <svg v-if="toastType === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <svg v-else-if="toastType === 'error'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
        </svg>
        {{ toastMessage }}
    </div>

    <div class="login-container">
        <div class="brand">
            <img src="/images/logo.png" alt="评鉴"
                 style="width:100%;height:100%;max-width:38px;max-height:38px;object-fit:contain;display:block;">
            <h1>评鉴 · AI 评价助手</h1>
            <p>看你的图 · 聊你的画 · 记得你的偏好</p>
        </div>

        <form @submit.prevent="handleLogin">
            <div class="form-group">
                <label for="username">账号</label>
                <input
                    id="username"
                    type="text"
                    v-model="username"
                    placeholder="请输入账号"
                    :class="{ error: usernameError }"
                    autocomplete="username"
                    required
                >
                <div class="error-message" :class="{ show: usernameError }">{{ usernameErrorMessage }}</div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input
                    id="password"
                    type="password"
                    v-model="password"
                    placeholder="请输入密码"
                    :class="{ error: passwordError }"
                    autocomplete="current-password"
                    required
                >
                <div class="error-message" :class="{ show: passwordError }">{{ passwordErrorMessage }}</div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" v-model="rememberMe"> 记住账号
                </label>
                <a href="#" @click.prevent="showToast('请联系管理员重置密码', 'info')">忘记密码？</a>
            </div>

            <button type="submit" class="login-btn" :disabled="loading" :class="{ loading: loading }">
                {{ loading ? '登录中...' : '登 录' }}
            </button>
        </form>

        <div class="register-link">
            还没有账号？ <a href="#" @click.prevent="showToast('请联系管理员开通账号', 'info')">申请账号</a>
        </div>

        <div class="footer-note">© 评鉴 · AI 评价助手</div>
    </div>
</div>

<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const username = ref('');
            const password = ref('');
            const rememberMe = ref(false);
            const loading = ref(false);
            const usernameError = ref(false);
            const passwordError = ref(false);
            const usernameErrorMessage = ref('');
            const passwordErrorMessage = ref('');
            const toastVisible = ref(false);
            const toastMessage = ref('');
            const toastType = ref('success');

            let toastTimer = null;

            const showToast = (message, type = 'success') => {
                toastMessage.value = message;
                toastType.value = type;
                toastVisible.value = true;
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastVisible.value = false;
                }, 3000);
            };

            const handleLogin = async () => {
                usernameError.value = false;
                passwordError.value = false;
                usernameErrorMessage.value = '';
                passwordErrorMessage.value = '';

                if (!username.value.trim()) {
                    usernameError.value = true;
                    usernameErrorMessage.value = '请输入账号';
                    return;
                }
                if (!password.value) {
                    passwordError.value = true;
                    passwordErrorMessage.value = '请输入密码';
                    return;
                }

                loading.value = true;

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: username.value.trim(),
                            password: password.value
                        })
                    });

                    const result = await response.json();

                    if (response.ok && result.success) {
                        if (result.token) {
                            localStorage.setItem('authToken', result.token);
                        }
                        if (rememberMe.value) {
                            localStorage.setItem('rememberedUsername', username.value.trim());
                        } else {
                            localStorage.removeItem('rememberedUsername');
                        }
                        localStorage.setItem('currentUser', JSON.stringify(result.user || { username: username.value.trim() }));

                        showToast('登录成功，正在进入评鉴…', 'success');

                        setTimeout(() => {
                            window.location.href = '/index.html';
                        }, 600);
                    } else {
                        showToast(result.message || '账号或密码不对', 'error');
                        passwordError.value = true;
                        passwordErrorMessage.value = result.message || '账号或密码不对';
                    }
                } catch (error) {
                    showToast('网络不太行，稍后再试', 'error');
                    console.error('Login error:', error);
                } finally {
                    loading.value = false;
                }
            };

            const checkAuth = () => {
                const token = localStorage.getItem('authToken');
                if (token) {
                    fetch('/api/auth/verify', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                        .then(response => response.json())
                        .then(result => {
                            if (result.valid) {
                                window.location.href = '/index.html';
                            } else {
                                localStorage.removeItem('authToken');
                                localStorage.removeItem('currentUser');
                            }
                        })
                        .catch(() => {
                            localStorage.removeItem('authToken');
                            localStorage.removeItem('currentUser');
                        });
                }

                const remembered = localStorage.getItem('rememberedUsername');
                if (remembered) {
                    username.value = remembered;
                    rememberMe.value = true;
                }
            };

            onMounted(() => {
                checkAuth();
            });

            return {
                username,
                password,
                rememberMe,
                loading,
                usernameError,
                passwordError,
                usernameErrorMessage,
                passwordErrorMessage,
                toastVisible,
                toastMessage,
                toastType,
                handleLogin,
                showToast,
                checkAuth
            };
        }
    }).mount('#app');
</script>
</body>
</html>
